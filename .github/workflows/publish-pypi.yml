name: Publish to PyPI

# Owner Gate: configure GitHub environment pypi with required reviewers and main-only branch restrictions before dispatch.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA expected to be resolved by the release tag
        required: true
        type: string
      tag:
        description: Existing published GitHub Release tag with attached frozen artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify tag, release, source, and attached digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/verify-release-admission.py

  publish:
    needs: admission
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download and re-check admitted release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          rm -rf release-assets dist
          mkdir -p release-assets dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'release-manifest.json' \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir release-assets
          python scripts/verify-release-admission.py --local-dir release-assets
          find release-assets -maxdepth 1 -type f -name '*.whl' -exec cp {} dist/ \;
          find release-assets -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
          python -m pip install --upgrade pip twine
          python -m twine check dist/*
      - name: Publish the already-admitted artifacts
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          packages-dir: dist
